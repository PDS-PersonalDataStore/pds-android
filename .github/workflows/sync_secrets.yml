name: Sync Secrets to Other Repositories

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Keystore & F-Droid Secrets
        env:
          SYNC_PAT: ${{ secrets.GH_SYNC_TOKEN || secrets.SYNC_DEST_PAT }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FDROID_REPO_TOKEN: ${{ secrets.FDROID_REPO_TOKEN }}
        run: |
          export GH_TOKEN="$SYNC_PAT"

          for REPO in "Tau2C/Receipts" "Tau2C/wallet"; do
            echo "Syncing secrets to $REPO..."
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo -n "$KEYSTORE_BASE64" | gh secret set KEYSTORE_BASE64 -R "$REPO"
            fi
            if [ -n "$KEYSTORE_PASSWORD" ]; then
              echo -n "$KEYSTORE_PASSWORD" | gh secret set KEYSTORE_PASSWORD -R "$REPO"
            fi
            if [ -n "$KEY_ALIAS" ]; then
              echo -n "$KEY_ALIAS" | gh secret set KEY_ALIAS -R "$REPO"
            fi
            if [ -n "$KEY_PASSWORD" ]; then
              echo -n "$KEY_PASSWORD" | gh secret set KEY_PASSWORD -R "$REPO"
            fi
            if [ -n "$FDROID_REPO_TOKEN" ]; then
              echo -n "$FDROID_REPO_TOKEN" | gh secret set FDROID_REPO_TOKEN -R "$REPO"
            fi
          done

          echo "Secrets synced successfully."
