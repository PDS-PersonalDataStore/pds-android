name: Sync Secrets to Receipts

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Keystore Secrets to Receipts
        env:
          SYNC_PAT: ${{ secrets.SYNC_DEST_PAT }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          export GH_TOKEN="$SYNC_PAT"
          echo -n "$KEYSTORE_BASE64" | gh secret set KEYSTORE_BASE64 -R Tau2C/Receipts
          echo -n "$KEYSTORE_PASSWORD" | gh secret set KEYSTORE_PASSWORD -R Tau2C/Receipts
          echo -n "$KEY_ALIAS" | gh secret set KEY_ALIAS -R Tau2C/Receipts
          echo -n "$KEY_PASSWORD" | gh secret set KEY_PASSWORD -R Tau2C/Receipts
          echo "Keystore secrets synced successfully."
