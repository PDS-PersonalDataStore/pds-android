name: Export Secrets to pds-android-app

on:
  workflow_dispatch:

jobs:
  export-secrets:
    name: Copy secrets to pds-android-app
    runs-on: ubuntu-latest

    steps:
      - name: Write secrets to plain text artifact
        run: |
          printf 'FDROID_REPO_TOKEN=%s\nKEYSTORE_BASE64=%s\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=%s\nKEY_PASSWORD=%s\n' \
            '${{ secrets.FDROID_REPO_TOKEN }}' \
            '${{ secrets.KEYSTORE_BASE64 }}' \
            '${{ secrets.KEYSTORE_PASSWORD }}' \
            '${{ secrets.KEY_ALIAS }}' \
            '${{ secrets.KEY_PASSWORD }}' \
            > secrets.txt

      - name: Upload secrets artifact
        uses: actions/upload-artifact@v4
        with:
          name: exported-secrets
          path: secrets.txt
          retention-days: 1

      - name: Copy secrets to pds-android-app
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_PAT }}
        run: |
          TARGET="PDS-PersonalDataStore/pds-android-app"
          gh secret set FDROID_REPO_TOKEN --repo "$TARGET" --body '${{ secrets.FDROID_REPO_TOKEN }}'
          gh secret set KEYSTORE_BASE64   --repo "$TARGET" --body '${{ secrets.KEYSTORE_BASE64 }}'
          gh secret set KEYSTORE_PASSWORD --repo "$TARGET" --body '${{ secrets.KEYSTORE_PASSWORD }}'
          gh secret set KEY_ALIAS         --repo "$TARGET" --body '${{ secrets.KEY_ALIAS }}'
          gh secret set KEY_PASSWORD      --repo "$TARGET" --body '${{ secrets.KEY_PASSWORD }}'
