name: Build & Release Android Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  build-native:
    name: Build Native FFI Libraries (.so)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Cache cargo binaries and dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-ndk-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'pds-ffi/Cargo.toml') }}
          restore-keys: |
            cargo-ndk-${{ runner.os }}-

      - name: Install cargo-ndk
        run: which cargo-ndk || cargo install cargo-ndk

      - name: Build Native FFI libraries
        run: |
          mkdir -p jniLibs
          cargo ndk -t arm64-v8a -t x86_64 -o jniLibs build --release --manifest-path pds-ffi/Cargo.toml

      - name: Upload Native FFI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: jniLibs/
          retention-days: 1

  build-and-release:
    name: Build APK, AAR & Create Release
    needs: build-native
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Native FFI artifacts
        uses: actions/download-artifact@v4
        with:
          name: jniLibs
          path: app/src/main/jniLibs

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK and Client SDK AAR
        run: |
          gradle assembleRelease --stacktrace

      - name: Collect build artifacts
        run: |
          mkdir -p release-artifacts
          find . -name "*.apk" -exec cp {} release-artifacts/ \;
          find . -name "*.aar" -exec cp {} release-artifacts/ \;
          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
