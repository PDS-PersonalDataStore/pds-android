name: Build & Release Client SDK AAR

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release Client SDK AAR
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Client SDK AAR & Sources
        run: |
          gradle :client-sdk:assembleRelease :client-sdk:sourcesJar --stacktrace

      - name: Collect SDK artifacts
        run: |
          mkdir -p release-artifacts
          find client-sdk/build/outputs/aar/ -name "*.aar" -exec cp {} release-artifacts/ \;
          find client-sdk/build/libs/ -name "*.jar" -exec cp {} release-artifacts/ \;
          ls -la release-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-dev') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true




